<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><title>Portfolio Lens PWA</title><meta name="description" content="銘柄・国・資産クラス・口座別に資産配分を管理するポートフォリオアプリ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Portfolio Lens"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7788;--line:#e6e9f0;--accent:#315efb;--good:#138a55;--bad:#c33}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:1040px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;border-radius:22px;padding:22px}.hero h1{margin:0;font-size:24px}.herogrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:16px}.big{font-size:32px;font-weight:800}.kpi{background:#ffffff18;border-radius:14px;padding:12px}.kpi b{font-size:18px}.muted{color:var(--muted);font-size:12px}.hero .muted{color:#dbe4ff}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;position:sticky;top:0;z-index:4;padding:8px 0;background:var(--bg)}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs button{background:white;color:var(--muted);white-space:nowrap}.tabs button.on,.primary{background:var(--accent);color:white}.ghost{background:#eef2ff;color:var(--accent)}.danger{background:#fff1f2;color:#be123c}.grid{display:grid;grid-template-columns:1fr 2fr;gap:14px}.card{background:white;border-radius:18px;padding:17px;box-shadow:0 4px 18px #18213a0d}.wide{grid-column:1/-1}.card h2{font-size:16px;margin:0 0 13px}.row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.name{font-weight:750}.pct{text-align:right;font-weight:800}.bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--accent)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.breakdown{margin-top:12px;padding:12px;background:#f8faff;border-radius:12px}.brow{display:grid;grid-template-columns:1fr 1fr 75px auto;gap:7px;margin:7px 0}.notice{font-size:12px;color:var(--muted);line-height:1.55}.empty{text-align:center;color:var(--muted);padding:26px}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#eef2ff;color:#315efb;font-size:11px;margin-top:3px}.good{color:var(--good)}.bad{color:var(--bad)}canvas{max-height:280px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preset{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px}.progress{height:10px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:700px){.herogrid,.grid,.formgrid{grid-template-columns:1fr}.big{font-size:28px}.brow{grid-template-columns:1fr 1fr 65px auto}.row{grid-template-columns:1.4fr .9fr auto}.wrap{padding:10px 10px 80px}.card{padding:14px}}
</style></head><body><div class="wrap"><section class="hero"><h1>Portfolio Lens <small>PWA</small></h1><div class="muted">保有資産を、銘柄・国・資産クラス・口座で一元管理</div><div class="herogrid"><div><div class="big" id="total">¥0</div><div class="muted">総評価額</div></div><div class="kpi"><b id="profit">¥0</b><div class="muted">評価損益</div></div><div class="kpi"><b id="dividend">¥0</b><div class="muted">累計配当・分配金</div></div></div></section>
<div class="tabs" id="tabs"><button class="on" data-tab="holdings">保有銘柄</button><button data-tab="country">国別</button><button data-tab="asset">資産クラス</button><button data-tab="accountview">口座別</button><button data-tab="target">目標・買増</button><button data-tab="nisa">NISA</button><button data-tab="history">資産推移</button><button data-tab="add">＋追加</button></div>
<div class="grid"><section class="card" id="chartCard"><h2 id="chartTitle"></h2><canvas id="chart"></canvas></section><section class="card" id="listCard"><h2 id="listTitle"></h2><div id="list"></div></section>
<section class="card wide" id="addCard" hidden><h2>銘柄を追加</h2><div class="preset"><select id="preset"><option value="">プリセットを選択（任意）</option><option value="sp500">S&P500 インデックス</option><option value="allcountry">全世界株式（オール・カントリー）</option><option value="nasdaq">NASDAQ100</option><option value="topix">TOPIX</option><option value="gold">ゴールド</option><option value="cash">現金</option></select><button class="ghost" id="applyPreset">内訳を適用</button></div><div class="formgrid"><div><label class="muted">銘柄・ファンド名</label><input id="fundName"></div><div><label class="muted">現在評価額</label><input id="fundValue" type="number" inputmode="numeric"></div><div><label class="muted">取得額</label><input id="cost" type="number" inputmode="numeric"></div><div><label class="muted">口座区分</label><select id="account"><option>NISA（つみたて投資枠）</option><option>NISA（成長投資枠）</option><option>iDeCo</option><option>特定口座</option><option>企業型DC</option><option>預金・現金</option><option>その他</option></select></div><div><label class="muted">累計配当・分配金</label><input id="fundDividend" type="number" value="0" inputmode="numeric"></div></div><div class="breakdown"><b>国・資産クラス内訳</b><div class="notice">プリセットは簡易設定です。実際の構成比は変動するため、必要に応じて最新値へ修正してください。</div><div id="breakRows"></div><button class="ghost" id="addBreak">＋ 内訳</button></div><div id="sumMsg" class="notice"></div><div id="saveStatus" class="notice" style="margin:8px 0"></div><button class="primary" id="saveFund" type="button">保存</button></section>
<section class="card wide" id="targetCard" hidden><h2>目標ポートフォリオ</h2><div id="targetRows" class="breakdown"></div><div id="targetSum" class="notice"></div><button class="primary" id="saveTarget">目標を保存</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>買い増しシミュレーション</h2><div class="formgrid"><div><label class="muted">追加投資額</label><input id="addMoney" type="number" value="100000"></div><div><button class="ghost" id="calcRebalance" style="margin-top:18px">計算</button></div></div><div id="rebalanceResult"></div></section>
<section class="card wide" id="nisaCard" hidden><h2>NISA 年間投資枠</h2><div class="notice">年間投資枠の進捗管理用です。取得額・評価額とは別に、その年に実際に投資した金額を入力してください。</div><div class="formgrid"><div><label class="muted">つみたて投資枠 使用額</label><input id="nisaT" type="number"></div><div><label class="muted">成長投資枠 使用額</label><input id="nisaG" type="number"></div><div><button class="primary" id="saveNisa" style="margin-top:18px">保存</button></div></div><div id="nisaView" style="margin-top:18px"></div></section>
<section class="card wide" id="historyCard" hidden><h2>資産推移</h2><div class="actions"><button class="primary" id="snapshot">今日の残高を記録</button><button class="danger" id="clearHistory">履歴削除</button></div><canvas id="historyChart"></canvas><div id="historyList"></div></section>
<section class="card wide"><h2>バックアップ・データ管理</h2><div class="notice">データはこのブラウザ内に保存されます。機種変更やブラウザデータ削除に備えてバックアップしてください。</div><div class="actions" style="margin-top:12px"><button class="ghost" id="exportJson">バックアップ保存</button><button class="ghost" id="exportCsv">CSV出力</button><button class="ghost" id="importBtn">バックアップ復元</button><input id="importFile" type="file" accept="application/json" hidden><button class="ghost" id="sample">サンプル</button><button class="danger" id="clear">全削除</button></div></section></div></div>
<script>
const COUNTRIES=['米国','日本','英国','フランス','カナダ','スイス','ドイツ','中国','台湾','インド','豪州','その他'],ASSETS=['株式','債券','REIT','金','現金','その他'];
const PRESETS={sp500:{name:'S&P500 インデックス',parts:[['米国','株式',100]]},allcountry:{name:'全世界株式（オール・カントリー）',parts:[['米国','株式',65],['日本','株式',5],['英国','株式',4],['その他','株式',26]]},nasdaq:{name:'NASDAQ100',parts:[['米国','株式',100]]},topix:{name:'TOPIX',parts:[['日本','株式',100]]},gold:{name:'ゴールド',parts:[['その他','金',100]]},cash:{name:'現金',parts:[['日本','現金',100]]}};
let data=JSON.parse(localStorage.getItem('portfolioLens')||'[]'),targets=JSON.parse(localStorage.getItem('portfolioTargets')||'{"株式":70,"債券":15,"REIT":5,"金":5,"現金":5,"その他":0}'),history=JSON.parse(localStorage.getItem('portfolioHistory')||'[]'),nisa=JSON.parse(localStorage.getItem('portfolioNisa')||'{"t":0,"g":0}'),mode='holdings',chart,historyChart;
const $=id=>document.getElementById(id),yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'),pct=n=>(n||0).toFixed(1)+'%',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('portfolioLens',JSON.stringify(data));localStorage.setItem('portfolioTargets',JSON.stringify(targets));localStorage.setItem('portfolioHistory',JSON.stringify(history));localStorage.setItem('portfolioNisa',JSON.stringify(nisa))}function total(){return data.reduce((s,x)=>s+(+x.value||0),0)}function costTotal(){return data.reduce((s,x)=>s+(+x.cost||+x.value||0),0)}
function aggregate(type){let m={};data.forEach(f=>(f.parts||[]).forEach(p=>{let k=type==='country'?p.country:p.asset;m[k]=(m[k]||0)+f.value*p.weight/100}));return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}function accountAgg(){let m={};data.forEach(f=>m[f.account||'その他']=(m[f.account||'その他']||0)+(+f.value||0));return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}
function render(){let T=total(),profit=T-costTotal();$('total').textContent=yen(T);$('profit').textContent=(profit>=0?'+':'')+yen(profit);$('profit').className=profit>=0?'good':'bad';$('dividend').textContent=yen(data.reduce((s,x)=>s+(+x.dividend||0),0));let items=mode==='holdings'?data.map((f,i)=>({name:f.name,value:+f.value,index:i})).sort((a,b)=>b.value-a.value):mode==='accountview'?accountAgg():aggregate(mode);let titles={holdings:'保有銘柄',country:'国別配分',asset:'資産クラス別配分',accountview:'口座別配分'};$('chartTitle').textContent=titles[mode];$('listTitle').textContent=titles[mode];$('list').innerHTML=items.length?items.map(x=>{let f=mode==='holdings'?data[x.index]:null,pl=f?(+f.value||0)-(+f.cost||+f.value||0):0;return `<div class="row"><div><div class="name">${esc(x.name)}</div><div class="muted">${yen(x.value)}${f?` ・ <span class="${pl>=0?'good':'bad'}">損益 ${pl>=0?'+':''}${yen(pl)}</span><br><span class="pill">${esc(f.account||'')}</span>`:''}</div><div class="bar"><div class="fill" style="width:${T?x.value/T*100:0}%"></div></div></div><div class="pct">${pct(T?x.value/T*100:0)}</div>${f?`<button class="danger" onclick="delFund(${x.index})">削除</button>`:'<span></span>'}</div>`}).join(''):'<div class="empty">まだデータがありません</div>';if(chart)chart.destroy();chart=new Chart($('chart'),{type:'doughnut',data:{labels:items.map(x=>x.name),datasets:[{data:items.map(x=>x.value)}]},options:{plugins:{legend:{position:'bottom'}},cutout:'66%'}})}window.delFund=i=>{if(confirm('この銘柄を削除しますか？')){data.splice(i,1);save();render()}};
function addBreak(country='米国',asset='株式',weight=100){let d=document.createElement('div');d.className='brow';d.innerHTML=`<select class="country">${COUNTRIES.map(x=>`<option ${x===country?'selected':''}>${x}</option>`)}</select><select class="asset">${ASSETS.map(x=>`<option ${x===asset?'selected':''}>${x}</option>`)}</select><input class="weight" type="number" step=".1" value="${weight}"><button class="danger">×</button>`;d.querySelector('button').onclick=()=>{d.remove();sumBreak()};d.querySelector('.weight').oninput=sumBreak;$('breakRows').appendChild(d);sumBreak()}function sumBreak(){let s=[...document.querySelectorAll('#breakRows .weight')].reduce((a,x)=>a+(+x.value||0),0);$('sumMsg').textContent=`構成比合計：${s.toFixed(1)}% ${Math.abs(s-100)<.01?'✓':'（100%にしてください）'}`;$('sumMsg').className='notice '+(Math.abs(s-100)<.01?'good':'bad')}
$('addBreak').onclick=()=>addBreak('日本','株式',0);$('applyPreset').onclick=()=>{let p=PRESETS[$('preset').value];if(!p)return;$('fundName').value=p.name;$('breakRows').innerHTML='';p.parts.forEach(x=>addBreak(...x))};$('saveFund').onclick=()=>{
  const status=$('saveStatus');
  status.textContent='';
  try{
    const name=$('fundName').value.trim();
    const rawValue=$('fundValue').value.trim();
    const value=Number(rawValue);
    const rawCost=$('cost').value.trim();
    const cost=rawCost===''?value:Number(rawCost);
    const dividend=Number($('fundDividend').value)||0;
    const rows=[...document.querySelectorAll('#breakRows .brow')];
    const parts=rows.map(r=>({
      country:r.querySelector('.country').value,
      asset:r.querySelector('.asset').value,
      weight:Number(r.querySelector('.weight').value)||0
    }));

    if(!name){
      status.textContent='銘柄・ファンド名を入力してください。';
      status.className='notice bad';
      $('fundName').focus();
      return;
    }
    if(rawValue==='' || !Number.isFinite(value) || value<0){
      status.textContent='現在評価額を0円以上で入力してください。';
      status.className='notice bad';
      $('fundValue').focus();
      return;
    }
    if(!Number.isFinite(cost) || cost<0){
      status.textContent='取得額を0円以上で入力してください。';
      status.className='notice bad';
      $('cost').focus();
      return;
    }
    if(!parts.length){
      status.textContent='国・資産クラス内訳を1件以上入力してください。';
      status.className='notice bad';
      return;
    }
    const sum=parts.reduce((a,p)=>a+p.weight,0);
    if(Math.abs(sum-100)>.01){
      status.textContent=`内訳の合計を100%にしてください（現在 ${sum.toFixed(1)}%）。`;
      status.className='notice bad';
      return;
    }

    data.push({name,value,cost,dividend,account:$('account').value,parts});
    save();

    // Verify that browser storage accepted the update.
    const stored=JSON.parse(localStorage.getItem('portfolioLens')||'[]');
    if(!Array.isArray(stored) || stored.length!==data.length){
      throw new Error('保存データの確認に失敗しました');
    }

    $('fundName').value='';
    $('fundValue').value='';
    $('cost').value='';
    $('fundDividend').value='0';
    $('preset').value='';
    $('breakRows').innerHTML='';
    addBreak();
    status.textContent='✓ 登録しました';
    status.className='notice good';

    setTimeout(()=>switchTab('holdings'),350);
  }catch(err){
    console.error(err);
    status.textContent='保存中にエラーが発生しました。ページを再読み込みしてもう一度お試しください。';
    status.className='notice bad';
  }
};
function switchTab(x){mode=x;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===x));['add','target','nisa','history'].forEach(k=>$(k+'Card').hidden=x!==k);let special=['add','target','nisa','history'].includes(x);$('chartCard').hidden=special;$('listCard').hidden=special;if(!special)render();if(x==='target')renderTargets();if(x==='nisa')renderNisa();if(x==='history')renderHistory()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function renderTargets(){$('targetRows').innerHTML=ASSETS.map(a=>`<div class="brow" style="grid-template-columns:1fr 1fr"><b>${a}</b><input class="targetInput" data-asset="${a}" type="number" step=".1" value="${targets[a]||0}"></div>`).join('');document.querySelectorAll('.targetInput').forEach(i=>i.oninput=targetSum);targetSum()}function targetSum(){let s=[...document.querySelectorAll('.targetInput')].reduce((a,i)=>a+(+i.value||0),0);$('targetSum').textContent=`目標比率合計：${s.toFixed(1)}%`}$('saveTarget').onclick=()=>{let ins=[...document.querySelectorAll('.targetInput')],s=ins.reduce((a,i)=>a+(+i.value||0),0);if(Math.abs(s-100)>.01)return alert('100%にしてください。');targets={};ins.forEach(i=>targets[i.dataset.asset]=+i.value||0);save();alert('保存しました')};$('calcRebalance').onclick=()=>{let add=+$('addMoney').value||0,cur=Object.fromEntries(aggregate('asset').map(x=>[x.name,x.value])),T=total()+add,needs=ASSETS.map(a=>({asset:a,need:Math.max(0,T*(targets[a]||0)/100-(cur[a]||0))})),sum=needs.reduce((s,x)=>s+x.need,0);$('rebalanceResult').innerHTML='<div class="notice">売却せず、追加資金を不足資産へ配分する目安です。</div>'+needs.filter(x=>x.need>0).map(x=>`<div class="row"><b>${x.asset}</b><span class="pct">${yen(sum?add*x.need/sum:0)}</span><span></span></div>`).join('')};
function renderNisa(){$('nisaT').value=nisa.t||0;$('nisaG').value=nisa.g||0;let rows=[['つみたて投資枠',nisa.t||0,1200000],['成長投資枠',nisa.g||0,2400000]];$('nisaView').innerHTML=rows.map(([n,u,l])=>`<div style="margin:15px 0"><div class="row"><b>${n}</b><span class="pct">残り ${yen(Math.max(0,l-u))}</span><span></span></div><div class="progress"><div style="width:${Math.min(100,u/l*100)}%"></div></div><div class="muted">${yen(u)} / ${yen(l)}（${pct(u/l*100)}）</div></div>`).join('')}$('saveNisa').onclick=()=>{nisa={t:+$('nisaT').value||0,g:+$('nisaG').value||0};save();renderNisa()};
function renderHistory(){if(historyChart)historyChart.destroy();historyChart=new Chart($('historyChart'),{type:'line',data:{labels:history.map(x=>x.date),datasets:[{data:history.map(x=>x.value),label:'総資産',tension:.25}]},options:{plugins:{legend:{display:false}}}});$('historyList').innerHTML=history.slice().reverse().map(x=>`<div class="row"><b>${x.date}</b><span class="pct">${yen(x.value)}</span><span></span></div>`).join('')||'<div class="empty">履歴なし</div>'}$('snapshot').onclick=()=>{let d=new Date().toLocaleDateString('ja-JP'),i=history.findIndex(x=>x.date===d);if(i>=0)history[i].value=total();else history.push({date:d,value:total()});save();renderHistory()};$('clearHistory').onclick=()=>{if(confirm('履歴を削除しますか？')){history=[];save();renderHistory()}};
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('exportJson').onclick=()=>download('portfolio-lens-backup.json',JSON.stringify({version:3,data,targets,history,nisa},null,2),'application/json');$('exportCsv').onclick=()=>{let q=s=>'"'+String(s??'').replaceAll('"','""')+'"',rows=[['銘柄','評価額','取得額','損益','口座','配当・分配金'],...data.map(f=>[f.name,f.value,f.cost,(+f.value||0)-(+f.cost||0),f.account,f.dividend||0])];download('portfolio.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.data))throw 0;data=o.data;targets=o.targets||targets;history=o.history||[];nisa=o.nisa||nisa;save();render();alert('復元しました')}catch{alert('対応するバックアップファイルではありません')}};r.readAsText(f)};
$('sample').onclick=()=>{if(data.length&&!confirm('サンプルに置き換えますか？'))return;data=[{name:'S&P500 インデックス',value:1800000,cost:1500000,dividend:0,account:'NISA（成長投資枠）',parts:[{country:'米国',asset:'株式',weight:100}]},{name:'全世界株式（オール・カントリー）',value:1200000,cost:1050000,dividend:0,account:'NISA（つみたて投資枠）',parts:[{country:'米国',asset:'株式',weight:65},{country:'日本',asset:'株式',weight:5},{country:'英国',asset:'株式',weight:4},{country:'その他',asset:'株式',weight:26}]},{name:'ゴールド',value:350000,cost:300000,dividend:0,account:'特定口座',parts:[{country:'その他',asset:'金',weight:100}]},{name:'現金',value:650000,cost:650000,dividend:0,account:'預金・現金',parts:[{country:'日本',asset:'現金',weight:100}]}];save();switchTab('holdings')};$('clear').onclick=()=>{if(confirm('全データを削除しますか？')){data=[];targets={株式:70,債券:15,REIT:5,金:5,現金:5,その他:0};history=[];nisa={t:0,g:0};save();render()}};addBreak();render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script></body></html>
